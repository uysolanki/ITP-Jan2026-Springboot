<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Player List</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<a th:href="@{/productui/addProductForm}"
		class="btn btn-primary btn-sm">Add Product</a>
	<div class="container mt-5">


		<h2 class="mb-4">List of Products</h2>
		<table class="table table-bordered table-striped">
			<thead class="table-dark">
				<tr>
					<th>Product Title</th>
					<th>Product Description</th>
					<th>Product Category</th>
					<th>Product Price</th>
					<th>Product Image</th>
					<th>Delete</th>
					<th>Update</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="product : ${products}">
					<td th:text="${product.title}"></td>
					<td th:text="${product.description}"></td>
					<td th:text="${product.category}"></td>
					<td th:text="${product.price}"></td>

					<td><img th:src="${product.image}" width="80" height="80"
						style="object-fit: cover;"></td>

					<td><a th:href="@{'/productui/updateProductForm/' + ${product.id}}"
						class="btn btn-secondary btn-sm">Update</a>
					</td>

					<td><a
						th:href="@{'/productui/deleteProductUI/' + ${product.id}}"
						class="btn btn-danger btn-sm"
						onclick="return confirm('Are you sure you want to delete this product?');">Delete</a>
					</td>


				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
